<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Topier Wallet</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/home.css">
</head>
<body>
<header class="wrap home-top">
  <a class="brand" href="/" aria-label="Topier home"><img src="/assets/brand/topier-logo-light.svg" alt="Topier" width="150" height="40"></a>
  <nav class="home-nav"><a href="/">Home</a><button class="pill" id="accountBtn" type="button" hidden>Sign in</button></nav>
</header>
<main class="wrap">
  <section class="sky" style="padding:36px 28px">
    <h1 style="font-size:clamp(28px,4vw,44px)">Topier wallet</h1>
    <p class="lede">Where subscription payments land. Topier never holds this wallet's keys. You approve every outgoing transfer in your own wallet.</p>
  </section>
  <div id="gate" class="card quiet" hidden></div>
  <div id="body" hidden>
    <section class="section">
      <div class="stats" id="stats"></div>
      <p class="tiny muted" id="addrLine"></p>
    </section>
    <section class="section card quiet" id="sendCard">
      <h2>Send to one of your wallets</h2>
      <p class="muted" id="sendHelp"></p>
      <div id="sendBody"></div>
    </section>
    <section class="section">
      <div class="row-head"><h2>Payments received</h2><span class="tiny muted" id="payCount"></span></div>
      <div class="table" id="payments"></div>
    </section>
  </div>
</main>
<footer class="wrap foot"><p class="tiny">Owner only. Balances are read live from Base.</p></footer>
<div class="sheet-backdrop" id="backdrop" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>
<script type="module" src="/src/walletpage.js"></script>
</body>
</html>
